---
layout: default
section_id: page
---
<div class="container" data-pagefind-body>
    <div class="post__header">
      <h2>{{page.title}}</h2>
    </div>
    <div class="post__content">
      <div class="post__img">
        {%- if page.image -%}
        {% assign image = page.image.path | default: page.image | absolute_url %}
        <img src="https://wsrv.nl/?url={{ image | cgi_escape | escape }}&amp;output=webp" alt="{{ page.image.alt | default: page.title | escape }}">
        {%- endif -%}
      </div>
  
        {{content}}
  
    </div>
  
  </div>
