title: "Religion Call for Papers @relcfp #acrel"
email: contact@relcfp.com
description: >- # this means to ignore newlines until "baseurl:"
  Dedicated to call for papers & publications in Religious Studies/Religion, Philosophy, & Theology. Contributions Welcome.
baseurl: "" # the subpath of your site, e.g. /blog
#url: http://localhost:4000 # localhost
url: "https://relcfp.com" # the base hostname & protocol for your site, e.g. http://example.com
facebook_url: https://www.facebook.com/relcfp
twitter_url:  https://twitter.com/relcfp
bksy_url: https://bsky.app/profile/relcfp.com




# Build settings
markdown: kramdown
theme: minima

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from

permalink: pretty
paginate: 6
paginate_path: "/posts/page:num/"

feed:
  path: /posts/feed.atom


defaults:
  - scope:
      path: ""
      type: "tags"
    values:
      layout: "posts"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      paginate: true
  - scope:
      path: ""
    values:
      layout: "default"
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .DS_Store
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE
  - RUNLOG.MD
  - techstack.md
  - techstack.yml
  - get_rss.py
  - requirements.txt
  - tests/
  - __pycache__/
  - .venv/
  - netlify.toml
  - package.json
  - package-lock.json
  - pagefind.yml
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
