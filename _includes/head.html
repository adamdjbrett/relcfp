<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="fediverse:creator" content="@relcfp@mastodon.social">
  <link rel="preconnect" href="https://static.cloudflareinsights.com">
  <style>{% include main.css %}</style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📕</text></svg>">
  <link rel="preload" href="/pagefind/pagefind-ui.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/pagefind/pagefind-ui.css"></noscript>
  <link href="https://mastodon.social/@relcfp" rel="me">
  {% seo %}
  {% feed_meta %}
  <link rel="alternate" type="application/rss+xml" title="RELCFP RSS" href="{{ '/feed.rss' | relative_url }}">
  <link rel="alternate" type="application/feed+json" title="RELCFP JSON Feed" href="{{ '/feed.json' | relative_url }}">
  <link rel="alternate" type="text/plain" title="RELCFP twtxt" href="{{ '/twtxt.txt' | relative_url }}">
  <link rel="author" type="text/plain" href="{{ '/humans.txt' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": {{ site.title | jsonify }},
    "description": {{ site.description | strip_newlines | jsonify }},
    "url": {{ site.url | append: "/posts/" | jsonify }},
    "publisher": {
      "@type": "Organization",
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | jsonify }}
    },
    "inLanguage": "en-US"
  }
  </script>
</head>
