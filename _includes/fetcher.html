<div class="feed">
  {% for entry in site.data.feed.feed.entry %}
  <article class="feed-card">
    <h3><a href="{{ entry.id | escape }}">{{ entry.title | escape }}</a></h3>
    <p>URL: <a href="{{ entry.id | escape }}">{{ entry.id | escape }}</a></p>
    <p>{{ entry.content['#text'] | strip_html | escape }}</p>
    <p>Author: <a href="{{ entry.author.uri | escape }}">{{ entry.author.name | escape }}</a></p>
  </article>
  {% endfor %}
</div>
